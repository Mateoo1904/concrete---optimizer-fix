   [theme]
   base = "light"
   primaryColor = "#2ecc71"
   backgroundColor = "#ffffff"
   secondaryBackgroundColor = "#f5f7fa"
   textColor = "#1a1a1a"
   font = "sans serif"

   [server]
   headless = true
   port = 8501
   enableCORS = false
   enableXsrfProtection = true

   [browser]
   gatherUsageStats = false
